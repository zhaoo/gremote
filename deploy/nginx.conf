server {
    listen 80;
    server_name gremote.izhaoo.com;
    root /www/wwwroot/gremote/current;
    index index.html;
    access_log /www/wwwlogs/gremote.izhaoo.com.log;
    error_log /www/wwwlogs/gremote.izhaoo.com.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/gremote-acme; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; expires -1; }
}
