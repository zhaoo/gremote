server {
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/gremote.izhaoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gremote.izhaoo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_name gremote.izhaoo.com;
    root /www/wwwroot/gremote/current;
    index index.html;
    access_log /www/wwwlogs/gremote.izhaoo.com.log;
    error_log /www/wwwlogs/gremote.izhaoo.com.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/gremote-acme; }
    location ~ /\. { deny all; }
    location / {
        if ($scheme = http) { return 301 https://gremote.izhaoo.com$request_uri; }
        try_files $uri $uri/ =404;
        expires -1;
    }
}
